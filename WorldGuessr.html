<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldGuessr — The Arcade Room</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B0A0F;overflow:hidden}
  body{display:flex;flex-direction:column;font-family:"Space Mono",ui-monospace,monospace}

  .bar{
    display:flex;align-items:center;gap:14px;
    padding:9px 16px;
    background:#17141F;
    border-bottom:1px solid #2A2438;
    flex:0 0 auto;
  }
  .bar a{
    color:#8B8496;text-decoration:none;
    font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    transition:color .18s;
  }
  .bar a:hover,.bar a:focus-visible{color:#35E0E8}
  .bar strong{
    margin-left:auto;
    color:#FFC247;font-weight:400;
    font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  }

  .stage{flex:1 1 auto;position:relative;background:#000}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

  /* shows through only if the iframe refuses to load */
  .fallback{
    position:absolute;inset:0;
    display:grid;place-content:center;gap:14px;
    text-align:center;padding:30px;
    color:#8B8496;font-size:.8rem;letter-spacing:.08em;
    z-index:-1;
  }
  .fallback a{color:#35E0E8}
</style>
</head>
<body>

<div class="bar">
  <a href="index.html">&larr; Back to the arcade</a>
  <strong>WorldGuessr</strong>
</div>

<div class="stage">
  <p class="fallback">
    This game refused to load in a frame.<br>
    <a href="https://www.worldguessr.com/" target="_blank" rel="noopener">Open WorldGuessr directly &rarr;</a>
  </p>
  <iframe
    src="https://www.worldguessr.com/"
    title="WorldGuessr"
    allow="accelerometer; gyroscope; autoplay; fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

</body>
</html>
