<!DOCTYPE html>
<html lang="en" data-theme="arcade">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arcade Room</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&family=Space+Mono:wght@400;700&family=Alfa+Slab+One&family=Archivo:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Silkscreen:wght@400;700&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Audiowide&family=VT323&display=swap" rel="stylesheet">

<style>
/* ============================================================
   THEME VARIABLES
   Every theme sets the same set of vars; structure below reads
   only from these, so a new theme is a new block plus an entry
   in the THEMES object at the bottom of the script.
   ============================================================ */

/* ---- 1. ARCADE: dark room, neon cabinets ---- */
[data-theme="arcade"]{
  --bg:#0B0A0F; --bg-2:#17141F; --bg-3:#1F1A2B;
  --line:#2A2438; --text:#FFF3D6; --dim:#8B8496; --faint:#544D63;
  --accent:#FFC247; --hot:#E8402A; --cool:#35E0E8;
  --pick:#FFF3D6;

  --font-title:"Monoton",cursive;
  --font-ui:"Bungee",Impact,sans-serif;
  --font-body:"Space Mono",ui-monospace,monospace;
  --title-size:clamp(1.4rem,5.2vw,3.3rem);
  --title-weight:400;
  --title-spacing:.02em;
  --title-shadow:0 0 6px rgba(255,243,214,.9),0 0 22px rgba(255,194,71,.75),0 0 48px rgba(232,64,42,.45);

  --radius:8px; --radius-sm:3px;
  --art-ratio:4/3;
  --card-bg:#17141F; --card-bg-hover:#1F1A2B; --card-border:#2A2438;
  --card-shadow:0 10px 22px rgba(0,0,0,.5);
  --card-shadow-hover:0 18px 34px rgba(0,0,0,.6),0 0 34px color-mix(in srgb,var(--pick) 22%,transparent);
  --card-lift:translateY(-6px);
  --header-bg:linear-gradient(180deg,#221C30 0%,#191426 55%,#100D19 100%);
  --sign-bg:linear-gradient(180deg,#262034,#1B1626);
  --sign-color:#8D85A0;
  --deck-bg:linear-gradient(180deg,#1B1626,#131020);
  --art-filter:brightness(.55) saturate(.55) contrast(1.06);
  --art-filter-hover:brightness(1.04) saturate(1.08) contrast(1.02);
  --scanline:.34;
  --btn-shadow:none;
}

/* ---- 2. SHELF: cream rental shop ---- */
[data-theme="shelf"]{
  --bg:#F4EDE0; --bg-2:#EAE0CE; --bg-3:#FFFCF6;
  --line:#D8CBB4; --text:#231F1C; --dim:#7A6E63; --faint:#B3A797;
  --accent:#C98A00; --hot:#C8102E; --cool:#0E7C86;
  --pick:#231F1C;

  --font-title:"Alfa Slab One",Georgia,serif;
  --font-ui:"Archivo",system-ui,sans-serif;
  --font-body:"Courier Prime",monospace;
  --title-size:clamp(1.5rem,5vw,3rem);
  --title-weight:400;
  --title-spacing:.01em;
  --title-shadow:3px 3px 0 rgba(0,0,0,.22);

  --radius:5px; --radius-sm:3px;
  --art-ratio:4/5;
  --card-bg:#FFFCF6; --card-bg-hover:#FFFCF6; --card-border:#231F1C;
  --card-shadow:0 4px 0 rgba(0,0,0,.16);
  --card-shadow-hover:0 14px 18px rgba(0,0,0,.22);
  --card-lift:translateY(-9px) rotateX(6deg);
  --header-bg:#C8102E;
  --sign-bg:#FFFCF6;
  --sign-color:#231F1C;
  --deck-bg:#FFFCF6;
  --art-filter:none;
  --art-filter-hover:none;
  --scanline:0;
  --btn-shadow:3px 3px 0 var(--text);
}

/* ---- 3. BLOCKS: voxel sandbox ---- */
[data-theme="blocks"]{
  --bg:#2A2118; --bg-2:#3B2F22; --bg-3:#4A3B2A;
  --line:#5C4A34; --text:#EDE4D3; --dim:#A89680; --faint:#7A6A55;
  --accent:#7FB238; --hot:#C4643A; --cool:#5AA9C4;
  --pick:#7FB238;

  --font-title:"Silkscreen",monospace;
  --font-ui:"Silkscreen",monospace;
  --font-body:"Space Mono",ui-monospace,monospace;
  --title-size:clamp(1rem,3.6vw,2.2rem);
  --title-weight:700;
  --title-spacing:.04em;
  --title-shadow:4px 4px 0 rgba(0,0,0,.55);

  --radius:0; --radius-sm:0;
  --art-ratio:1/1;
  --card-bg:#3B2F22; --card-bg-hover:#4A3B2A; --card-border:#1B140D;
  --card-shadow:0 5px 0 #1B140D;
  --card-shadow-hover:0 9px 0 #1B140D;
  --card-lift:translateY(-4px);
  --header-bg:linear-gradient(180deg,#7FB238 0 14px,#6B4A2E 14px,#4A3B2A 100%);
  --sign-bg:#2F251A;
  --sign-color:#C9BBA4;
  --deck-bg:#2F251A;
  --art-filter:brightness(.85) saturate(1.1);
  --art-filter-hover:brightness(1.05) saturate(1.2);
  --scanline:0;
  --btn-shadow:0 4px 0 #1B140D;
}

/* ---- 4. BLOOM: soft pinks ---- */
[data-theme="bloom"]{
  --bg:#FFF3F8; --bg-2:#FFE6F1; --bg-3:#FFFFFF;
  --line:#FFD0E4; --text:#4A2740; --dim:#A8779A; --faint:#D3A8C4;
  --accent:#FF8FC5; --hot:#FF5C9E; --cool:#9B7DFF;
  --pick:#FF8FC5;

  --font-title:"Fredoka",system-ui,sans-serif;
  --font-ui:"Fredoka",system-ui,sans-serif;
  --font-body:"Quicksand",system-ui,sans-serif;
  --title-size:clamp(1.5rem,5.4vw,3.2rem);
  --title-weight:700;
  --title-spacing:.01em;
  --title-shadow:0 3px 0 rgba(255,143,197,.45);

  --radius:20px; --radius-sm:11px;
  --art-ratio:4/3;
  --card-bg:#FFFFFF; --card-bg-hover:#FFFFFF; --card-border:#FFD0E4;
  --card-shadow:0 6px 18px rgba(255,143,197,.22);
  --card-shadow-hover:0 14px 30px rgba(255,92,158,.34);
  --card-lift:translateY(-7px) scale(1.02);
  --header-bg:linear-gradient(160deg,#FFD9EC 0%,#FFE9F5 55%,#F0E4FF 100%);
  --sign-bg:#FFFFFF;
  --sign-color:#7A4A69;
  --deck-bg:#FFF7FB;
  --art-filter:saturate(1.05);
  --art-filter-hover:saturate(1.15) brightness(1.03);
  --scanline:0;
  --btn-shadow:0 4px 12px rgba(255,92,158,.3);
}

/* ---- 5. VAPOR: sunset grid ---- */
[data-theme="vapor"]{
  --bg:#170B2E; --bg-2:#231145; --bg-3:#2E1858;
  --line:#452680; --text:#F5E6FF; --dim:#A98BD8; --faint:#6F55A8;
  --accent:#FF71CE; --hot:#FF6A3D; --cool:#01CDFE;
  --pick:#FF71CE;

  --font-title:"Audiowide",system-ui,sans-serif;
  --font-ui:"Audiowide",system-ui,sans-serif;
  --font-body:"Space Mono",ui-monospace,monospace;
  --title-size:clamp(1.2rem,4.4vw,2.7rem);
  --title-weight:400;
  --title-spacing:.06em;
  --title-shadow:2px 0 0 #01CDFE,-2px 0 0 #FF6A3D,0 0 30px rgba(255,113,206,.7);

  --radius:4px; --radius-sm:2px;
  --art-ratio:4/3;
  --card-bg:#231145; --card-bg-hover:#2E1858; --card-border:#452680;
  --card-shadow:0 8px 24px rgba(0,0,0,.5);
  --card-shadow-hover:0 0 0 1px var(--pick),0 14px 34px rgba(255,113,206,.3);
  --card-lift:translateY(-5px);
  --header-bg:linear-gradient(180deg,#2E1858 0%,#4A1F6B 60%,#8E2A6B 100%);
  --sign-bg:linear-gradient(180deg,#331C63,#251247);
  --sign-color:#C4A6EE;
  --deck-bg:linear-gradient(180deg,#251247,#1B0E38);
  --art-filter:brightness(.7) saturate(1.3) contrast(1.05);
  --art-filter-hover:brightness(1.05) saturate(1.4);
  --scanline:.22;
  --btn-shadow:0 0 18px rgba(255,113,206,.4);
}

/* ---- 6. TERMINAL: green phosphor ---- */
[data-theme="terminal"]{
  --bg:#020A04; --bg-2:#04160A; --bg-3:#06200E;
  --line:#0E4A21; --text:#39FF6A; --dim:#1F9E44; --faint:#146B2E;
  --accent:#39FF6A; --hot:#39FF6A; --cool:#39FF6A;
  --pick:#39FF6A;

  --font-title:"VT323",monospace;
  --font-ui:"VT323",monospace;
  --font-body:"VT323",monospace;
  --title-size:clamp(1.8rem,6vw,3.6rem);
  --title-weight:400;
  --title-spacing:.08em;
  --title-shadow:0 0 12px rgba(57,255,106,.85),0 0 34px rgba(57,255,106,.4);

  --radius:0; --radius-sm:0;
  --art-ratio:4/3;
  --card-bg:#04160A; --card-bg-hover:#06200E; --card-border:#0E4A21;
  --card-shadow:none;
  --card-shadow-hover:0 0 0 1px var(--pick),0 0 26px rgba(57,255,106,.28);
  --card-lift:none;
  --header-bg:#04160A;
  --sign-bg:#021006;
  --sign-color:#1F9E44;
  --deck-bg:#021006;
  --art-filter:brightness(.68) saturate(.9) contrast(1.08);
  --art-filter-hover:brightness(1.02) saturate(1.05) contrast(1.02);
  --scanline:.45;
  --btn-shadow:none;
}

/* ============================================================
   STRUCTURE — reads only from the vars above
   ============================================================ */

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .3s,color .3s;
}

/* room vignette, dark themes only */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(ellipse 90% 70% at 50% 30%,transparent 40%,rgba(0,0,0,.72) 100%);
  opacity:0;transition:opacity .3s;
}
[data-theme="arcade"] body::after,
[data-theme="vapor"] body::after,
[data-theme="terminal"] body::after{opacity:1}

/* ---------- HEADER ---------- */
.marquee{
  position:relative;padding:24px 20px 26px;text-align:center;
  background:var(--header-bg);
  border-bottom:2px solid rgba(0,0,0,.5);
}
[data-theme="shelf"] .marquee{border-bottom:5px solid var(--text);color:var(--bg)}
[data-theme="bloom"] .marquee{border-bottom:none}
.marquee::after{
  content:"";position:absolute;left:0;right:0;top:100%;height:240px;pointer-events:none;
  background:radial-gradient(ellipse 70% 100% at 50% 0%,
    color-mix(in srgb,var(--pick) 13%,transparent),transparent 72%);
  transition:background .4s;
}
[data-theme="shelf"] .marquee::after,
[data-theme="bloom"] .marquee::after{display:none}

.bulbs{display:flex;justify-content:center;gap:clamp(8px,2.2vw,18px);padding:0 4px}
.bulbs.bottom{margin-top:18px}
.bulb{
  width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto;
  animation:chase 2.4s linear infinite;animation-delay:calc(var(--i) * .12s);
}
@keyframes chase{
  0%,72%{background:var(--faint);box-shadow:none}
  82%{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  100%{background:var(--faint);box-shadow:none}
}
[data-theme="shelf"] .bulbs,[data-theme="bloom"] .bulbs{display:none}

.marquee h1{
  font-family:var(--font-title);font-weight:var(--title-weight);
  font-size:var(--title-size);line-height:1.12;letter-spacing:var(--title-spacing);
  margin:18px auto 0;max-width:18ch;
  color:var(--text);text-shadow:var(--title-shadow);
}
[data-theme="shelf"] .marquee h1{color:var(--bg)}
[data-theme="arcade"] .marquee h1{animation:tube 7s steps(1) infinite}
@keyframes tube{0%,96%,100%{opacity:1}97%{opacity:.72}98%{opacity:1}99%{opacity:.85}}
.marquee p{
  margin-top:11px;font-family:var(--font-body);
  font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);
}
[data-theme="shelf"] .marquee p{color:rgba(255,255,255,.85)}
[data-theme="terminal"] .marquee p{font-size:.9rem;letter-spacing:.2em}

/* ---------- THEME PICKER ---------- */
.themes{
  display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:18px;
}
.theme-btn{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radius-sm);padding:5px 10px;
  font-family:var(--font-ui);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text);transition:transform .14s,border-color .14s,background .14s;
}
[data-theme="shelf"] .theme-btn{background:rgba(255,255,255,.9);color:var(--text);border-color:var(--text)}
[data-theme="bloom"] .theme-btn{background:rgba(255,255,255,.75);border-color:var(--line)}
[data-theme="terminal"] .theme-btn{font-size:.85rem}
.theme-btn:hover{transform:translateY(-2px)}
.theme-btn:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.theme-btn[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,255,255,.14)}
[data-theme="shelf"] .theme-btn[aria-pressed="true"]{background:#fff;box-shadow:2px 2px 0 var(--text)}
.swatch{width:11px;height:11px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.35)}

/* ---------- SHELL ---------- */
.shell{
  position:relative;z-index:2;max-width:1600px;margin:0 auto;
  display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;
}

/* ---------- SIDEBAR ---------- */
.side{
  position:sticky;top:0;max-height:100vh;overflow-y:auto;
  padding:26px 15px 40px;border-right:1px solid var(--line);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
[data-theme="shelf"] .side,[data-theme="blocks"] .side,[data-theme="bloom"] .side{background:var(--bg-2)}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:var(--line)}
.side h2{
  font-family:var(--font-ui);font-size:.56rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:20px 0 8px 10px;font-weight:400;
}
[data-theme="terminal"] .side h2{font-size:.85rem}
.side h2:first-child{margin-top:0}
.pick{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;border-left:2px solid transparent;
  padding:8px 10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  color:var(--dim);font-family:var(--font-body);font-size:.74rem;letter-spacing:.04em;
  text-align:left;cursor:pointer;
  transition:color .16s,background .16s,border-color .16s;
}
[data-theme="terminal"] .pick{font-size:1rem}
[data-theme="bloom"] .pick{border-left:none;border-radius:var(--radius-sm)}
.pick .lamp{
  width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto;
  transition:background .16s,box-shadow .16s,opacity .16s;
}
[data-theme="blocks"] .pick .lamp,[data-theme="shelf"] .pick .lamp{border-radius:1px;width:10px;height:10px}
.pick .label{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .n{font-size:.64rem;color:var(--faint);flex:0 0 auto}
.pick:hover{color:var(--text);background:rgba(128,128,128,.09)}
.pick:hover .lamp{background:var(--tone,var(--dim));opacity:.55}
.pick:focus-visible{outline:2px solid var(--cool);outline-offset:-2px}
.pick[aria-pressed="true"]{
  color:var(--text);
  background:color-mix(in srgb,var(--tone,var(--accent)) 12%,transparent);
  border-left-color:var(--tone,var(--accent));
}
[data-theme="bloom"] .pick[aria-pressed="true"],
[data-theme="shelf"] .pick[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tone,var(--accent))}
.pick[aria-pressed="true"] .lamp{
  opacity:1;background:var(--tone,var(--accent));
  box-shadow:0 0 9px var(--tone,var(--accent));
}
.pick[aria-pressed="true"] .n{color:var(--tone,var(--accent))}
.sortpick{--tone:var(--pick)}

/* ---------- MAIN ---------- */
.main{padding:26px clamp(14px,2.6vw,30px) 90px;min-width:0}
.readout{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;
  font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  margin-bottom:15px;
}
[data-theme="terminal"] .readout{font-size:.95rem}
.readout b{color:var(--cool);font-weight:700}
.readout .coin{color:var(--hot)}
.readout .now{color:var(--pick);transition:color .35s}
.dice{
  margin-left:auto;background:none;border:1px solid var(--line);
  border-radius:var(--radius-sm);color:var(--dim);
  font-family:var(--font-ui);font-size:.56rem;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 13px;cursor:pointer;box-shadow:var(--btn-shadow);
  transition:color .16s,border-color .16s,background .16s,transform .12s;
}
[data-theme="terminal"] .dice{font-size:.9rem}
.dice:hover,.dice:focus-visible{
  color:var(--bg);background:var(--pick);border-color:var(--pick);outline:none;
}
[data-theme="shelf"] .dice:hover,[data-theme="blocks"] .dice:hover{transform:translate(1px,2px)}

.search-slot{
  display:flex;align-items:center;gap:12px;background:var(--bg-3);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 16px;
  transition:border-color .22s,box-shadow .22s;
}
[data-theme="shelf"] .search-slot,[data-theme="blocks"] .search-slot{border-width:2px;border-color:var(--text)}
.search-slot:focus-within{
  border-color:var(--pick);
  box-shadow:0 0 20px color-mix(in srgb,var(--pick) 25%,transparent);
}
.search-slot span{color:var(--hot);font-size:1rem;line-height:1}
#search{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font-family:var(--font-body);font-size:.95rem;letter-spacing:.06em;padding:14px 0;
}
[data-theme="terminal"] #search{font-size:1.15rem}
#search::placeholder{color:var(--faint)}
.hint{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:11px}
[data-theme="terminal"] .hint{font-size:.85rem}

/* ---------- RECENT CONTROLS ---------- */
.subbar{
  display:none;align-items:center;flex-wrap:wrap;gap:8px;margin-top:16px;
  padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-2);
}
.subbar.on{display:flex}
.subbar .lead{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.range,.wipe{
  font-family:var(--font-ui);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border-radius:var(--radius-sm);cursor:pointer;
  background:none;border:1px solid var(--line);color:var(--dim);
  transition:color .16s,background .16s,border-color .16s;
}
[data-theme="terminal"] .range,[data-theme="terminal"] .wipe{font-size:.85rem}
.range:hover{color:var(--text);border-color:var(--dim)}
.range[aria-pressed="true"]{color:var(--bg);background:var(--pick);border-color:var(--pick)}
.wipe{margin-left:auto;color:var(--hot);border-color:color-mix(in srgb,var(--hot) 45%,transparent)}
.wipe:hover{border-color:var(--hot)}
.wipe.armed{color:#fff;background:var(--hot);border-color:var(--hot)}

/* ---------- SPOTLIGHT ---------- */
.spot{
  position:relative;display:none;margin-top:22px;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--bg-3);text-decoration:none;color:inherit;min-height:170px;
  transition:border-color .3s,box-shadow .3s,transform .2s;
}
[data-theme="shelf"] .spot,[data-theme="blocks"] .spot{border-width:2px;border-color:var(--text);box-shadow:var(--btn-shadow)}
.spot.on{display:grid;grid-template-columns:220px minmax(0,1fr)}
.spot:hover,.spot:focus-visible{
  border-color:var(--pick);outline:none;
  box-shadow:0 0 40px color-mix(in srgb,var(--pick) 20%,transparent);
}
.spot__wash{
  position:absolute;inset:0;pointer-events:none;background-size:cover;background-position:center;
  filter:blur(28px) saturate(1.5) brightness(.42);opacity:.5;transform:scale(1.25);
}
[data-theme="shelf"] .spot__wash,[data-theme="bloom"] .spot__wash{opacity:.12}
.spot__veil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,color-mix(in srgb,var(--bg) 90%,transparent) 30%,color-mix(in srgb,var(--bg) 55%,transparent) 100%);
}
.spot__art{
  position:relative;z-index:1;margin:14px;background:#000;
  border-radius:var(--radius-sm);overflow:hidden;
}
[data-theme="shelf"] .spot__art,[data-theme="blocks"] .spot__art{border:2px solid var(--text)}
.spot__art img{display:block;width:100%;height:100%;aspect-ratio:var(--art-ratio);object-fit:cover}
.spot__body{
  position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;
  gap:11px;padding:20px 22px 20px 6px;
}
.spot__eyebrow{font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:var(--pick)}
[data-theme="terminal"] .spot__eyebrow{font-size:.85rem}
.spot__title{
  font-family:var(--font-ui);font-weight:var(--title-weight);
  font-size:clamp(1rem,2.3vw,1.65rem);line-height:1.15;color:var(--text);
}
.spot__tags{display:flex;flex-wrap:wrap;gap:7px}
.spot__go{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
[data-theme="terminal"] .spot__go{font-size:.85rem}
.spot__dots{position:absolute;right:16px;bottom:14px;z-index:2;display:flex;gap:6px}
.spot__dots i{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.spot__dots i.live{background:var(--pick);box-shadow:0 0 8px var(--pick)}

.tag{
  font-size:.53rem;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;white-space:nowrap;
  font-family:var(--font-ui);
  color:var(--tone,var(--dim));
  background:color-mix(in srgb,var(--tone,var(--dim)) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--tone,var(--dim)) 34%,transparent);
}
[data-theme="shelf"] .tag,[data-theme="blocks"] .tag{color:#fff;background:var(--tone,var(--dim));border-color:rgba(0,0,0,.3)}
[data-theme="terminal"] .tag{font-size:.8rem}

/* ---------- THE FLOOR ---------- */
.floor{
  margin-top:24px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;perspective:900px;
}
[data-theme="shelf"] .floor{gap:26px 18px}

.slot{display:flex;flex-direction:column;animation:powerup .4s ease backwards;animation-delay:calc(var(--n) * 18ms)}
@keyframes powerup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cab{
  position:relative;flex:1 1 auto;display:flex;flex-direction:column;
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:var(--card-shadow);transform-origin:bottom center;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
[data-theme="shelf"] .cab,[data-theme="blocks"] .cab{border-width:2px}
.cab__sign{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:46px;padding:9px 30px 9px 10px;
  background:var(--sign-bg);border-bottom:1px solid rgba(0,0,0,.5);
  font-family:var(--font-ui);font-size:.58rem;line-height:1.35;
  letter-spacing:.04em;text-transform:uppercase;color:var(--sign-color);
  transition:color .22s,background .22s,text-shadow .22s;
}
[data-theme="terminal"] .cab__sign{font-size:.9rem}
[data-theme="bloom"] .cab__sign{text-transform:none;letter-spacing:0;font-size:.8rem}

/* shelf theme puts the label under the art instead of above it */
[data-theme="shelf"] .cab{flex-direction:column-reverse;justify-content:flex-end}
[data-theme="shelf"] .cab__sign{border-bottom:none;border-top:2px solid var(--text);text-transform:none;font-size:.74rem}

.cab__screen{position:relative;background:#000;padding:7px}
[data-theme="shelf"] .cab__screen,[data-theme="bloom"] .cab__screen{padding:0}
.cab__screen img{
  display:block;width:100%;aspect-ratio:var(--art-ratio);object-fit:cover;
  border-radius:var(--radius-sm);filter:var(--art-filter);transition:filter .28s;
}
[data-theme="blocks"] .cab__screen img{image-rendering:pixelated}
.cab__screen::after{
  content:"";position:absolute;inset:7px;border-radius:var(--radius-sm);pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,var(--scanline)) 0 1px,transparent 1px 3px);
}
.cab__flash{
  position:absolute;inset:7px;border-radius:var(--radius-sm);pointer-events:none;z-index:2;
  background:var(--text);opacity:0;
}
[data-theme="arcade"] .cab:hover .cab__flash,
[data-theme="terminal"] .cab:hover .cab__flash{animation:switchon .42s ease}
@keyframes switchon{
  0%{opacity:0;transform:scaleY(.008)}
  22%{opacity:.62;transform:scaleY(.02)}
  55%{opacity:.16;transform:scaleY(1)}
  100%{opacity:0;transform:scaleY(1)}
}
.cab__chip{position:absolute;left:12px;top:12px;z-index:3;opacity:.75;transition:opacity .22s}
.cab:hover .cab__chip{opacity:1}

.cab__deck{
  display:flex;align-items:center;gap:7px;padding:10px 12px;
  background:var(--deck-bg);border-top:1px solid rgba(0,0,0,.45);
  font-size:.55rem;color:var(--faint);
}
[data-theme="terminal"] .cab__deck{font-size:.8rem}
[data-theme="shelf"] .cab__deck{order:3;border-top:none;color:var(--dim);font-family:var(--font-body)}
.stick{width:9px;height:9px;border-radius:50%;background:var(--faint);
  box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line);transition:background .22s}
.btn-a,.btn-b{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:box-shadow .22s,background .22s}
[data-theme="shelf"] .stick,[data-theme="shelf"] .btn-a,[data-theme="shelf"] .btn-b,
[data-theme="bloom"] .stick,[data-theme="bloom"] .btn-a,[data-theme="bloom"] .btn-b{display:none}
.plays,.when{margin-left:auto;letter-spacing:.06em;white-space:nowrap}
.ext{margin-left:auto;letter-spacing:.08em}
.plays + .ext,.when + .drop + .ext{margin-left:8px}

.cab:hover,.cab:focus-visible{
  transform:var(--card-lift);background:var(--card-bg-hover);
  border-color:color-mix(in srgb,var(--pick) 55%,var(--card-border));
  box-shadow:var(--card-shadow-hover);outline:none;
}
.cab:hover .cab__sign{color:var(--text)}
.cab:hover .cab__screen img{filter:var(--art-filter-hover)}
.cab:hover .stick{background:var(--hot)}
.cab:hover .btn-a{background:var(--hot);box-shadow:0 0 9px var(--hot)}
.cab:hover .btn-b{background:var(--cool);box-shadow:0 0 9px var(--cool)}
.cab:hover .plays,.cab:hover .ext{color:var(--pick)}

/* wooden shelf lip, shelf theme only */
.shelf-lip{display:none;height:9px;margin-top:2px;border-radius:0 0 3px 3px}
[data-theme="shelf"] .shelf-lip{
  display:block;
  background:linear-gradient(180deg,#8A5A3B 0%,#5E3A24 100%);
  box-shadow:0 4px 7px rgba(0,0,0,.28);
}

.star{
  position:absolute;top:5px;right:5px;width:26px;height:26px;
  display:grid;place-items:center;background:none;border:none;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--faint);font-size:.85rem;line-height:1;z-index:4;padding:0;
  transition:color .16s,transform .16s;
}
[data-theme="shelf"] .star,[data-theme="blocks"] .star{background:var(--card-bg);border:2px solid var(--card-border)}
.star:hover{color:var(--accent);transform:scale(1.18)}
.star:focus-visible{outline:2px solid var(--cool);outline-offset:1px}
.star[aria-pressed="true"]{color:var(--accent);text-shadow:0 0 12px var(--accent)}

.drop{
  background:none;border:none;cursor:pointer;padding:0 0 0 8px;
  color:var(--faint);font-size:.72rem;line-height:1;transition:color .16s,transform .16s;
}
.drop:hover{color:var(--hot);transform:scale(1.2)}
.drop:focus-visible{outline:2px solid var(--cool);outline-offset:1px}

/* ---------- EMPTY / FOOTER ---------- */
.empty{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  border:1px dashed var(--line);border-radius:var(--radius);
}
.empty strong{
  display:block;font-family:var(--font-ui);font-size:1rem;
  letter-spacing:.05em;color:var(--hot);margin-bottom:11px;
}
.empty span{font-size:.75rem;letter-spacing:.1em;color:var(--dim)}
footer{
  position:relative;z-index:2;text-align:center;padding:0 20px 50px;
  font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
}
noscript{display:block;padding:26px;text-align:center;color:var(--hot)}

/* ---------- IDLE TAKEOVER ---------- */
.takeover{
  position:fixed;inset:0;z-index:80;display:none;place-items:center;
  background:var(--bg);opacity:0;transition:opacity .7s;
}
.takeover.up{display:grid;opacity:1}
.takeover__wash{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(60px) saturate(1.7) brightness(.5);transform:scale(1.3);opacity:.55;
}
.takeover__veil{position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 70% at 50% 45%,transparent 20%,color-mix(in srgb,var(--bg) 88%,transparent) 100%)}
.takeover__inner{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  gap:20px;padding:24px;text-align:center;max-width:min(680px,90vw);
}
.takeover__art{
  position:relative;width:min(420px,74vw);background:#000;
  border-radius:var(--radius);overflow:hidden;display:block;text-decoration:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 24px 66px rgba(0,0,0,.8);
}
.takeover__art img{display:block;width:100%;aspect-ratio:var(--art-ratio);object-fit:cover}
.takeover__title{
  font-family:var(--font-ui);font-weight:var(--title-weight);
  font-size:clamp(1.3rem,4.4vw,2.4rem);line-height:1.1;color:var(--text);
}
.takeover__tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.takeover__cue{
  font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
  animation:blink 1.5s steps(1) infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.22}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition-duration:.01ms !important}
  .bulb{background:var(--accent)}
}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{
    position:sticky;top:0;z-index:9;max-height:none;overflow-x:auto;overflow-y:hidden;
    display:flex;align-items:center;gap:6px;padding:12px;
    border-right:none;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);
  }
  .side h2{display:none}
  .pick{width:auto;flex:0 0 auto;border-left:none;border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:7px 12px}
  .main{padding-top:20px}
  .spot.on{grid-template-columns:1fr}
  .floor{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .cab__sign{font-size:.52rem;min-height:42px}
  .dice{margin-left:0}
}
</style>
</head>

            all:"Everything", fav:"♥ Loved", recent:"↺ Just played", browser:"⌘ Browser",
            groups:["My stuff","Moods","Sort by"], sorts:["My order","A – Z","Most played"],
            r1:"Hi <b>you</b>", r2:"Mood <b>✿ good</b>",
            showing:"Showing", lit:"Here", dice:"✿ Pick for me",
            search:"Find something…", hint:"arrow keys to browse",
            eyebrow:"Today's pick", plays:"played ×", none:"new",
            foot:"The Arcade Room" },
    colours:{ "Action":"#FF6B6B","Platformers":"#7BC7FF","Runners":"#FFC46B","Racing":"#C77BFF",
              "Fighting":"#6BD9A8","Shooters":"#FF9E6B","Sports":"#8FA8FF",
              "Puzzle & Strategy":"#6BD4D4","Casual":"#FF8FC5","Horror":"#B4D96B",
              "Sandbox":"#9B7DFF","Retro":"#FFA8C4" }
  },
  vapor: {
    label:"Vapor", swatch:"#FF71CE",
    words:{ name:"The Arcade Room", unit:"track", tail:"after hours",
            all:"All games", fav:"★ Saved", recent:"↺ Recently played", browser:"⌘ Browser",
            groups:["The mall","Channels","Sort"], sorts:["Mall order","A – Z","Most played"],
            r1:"User <b>001</b>", r2:'Credits <b class="coin">∞</b>',
            showing:"Now playing", lit:"Online", dice:"⚅ Shuffle",
            search:"Search…", hint:"arrow keys to browse",
            eyebrow:"Now playing", plays:"×", none:"new",
            foot:"The Arcade Room" },
    colours:{ "Action":"#FF6A3D","Platformers":"#01CDFE","Runners":"#FFE05D","Racing":"#FF71CE",
              "Fighting":"#05FFA1","Shooters":"#FF9E43","Sports":"#7B8CFF",
              "Puzzle & Strategy":"#3DE0DA","Casual":"#FF8FE0","Horror":"#B6FF3D",
              "Sandbox":"#B967FF","Retro":"#FF5F87" }
  },
  terminal: {
    label:"Terminal", swatch:"#39FF6A",
    words:{ name:"THE ARCADE ROOM", unit:"entry", tail:"no quarters needed",
            all:"ALL", fav:"* STARRED", recent:"> RECENT", browser:"> BROWSER",
            groups:["SYSTEM","INDEX","SORT"], sorts:["DEFAULT","A – Z","MOST RUN"],
            r1:"USER <b>001</b>", r2:"MEM <b>OK</b>",
            showing:"FILTER", lit:"COUNT", dice:"RND",
            search:"QUERY…", hint:"arrow keys to browse",
            eyebrow:"AUTORUN", plays:"RUNS ", none:"NEW",
            foot:"THE ARCADE ROOM" },
    colours:{ "Action":"#FF5C4D","Platformers":"#57C7FF","Runners":"#FFD34D","Racing":"#E06BFF",
              "Fighting":"#39FF6A","Shooters":"#FF9A3D","Sports":"#7B92FF",
              "Puzzle & Strategy":"#3DE5C8","Casual":"#FF77BC","Horror":"#B6F04D",
              "Sandbox":"#B98CFF","Retro":"#FF8A8A" }
  }
};

const ORDER = ["Action","Platformers","Runners","Racing","Fighting","Shooters",
               "Sports","Puzzle & Strategy","Casual","Horror","Sandbox","Retro"];

const store = {
  get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const key  = g => g.x || g.f;
const href = g => g.x ? g.x : encodeURI(g.f);
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $    = id => document.getElementById(id);

let theme  = store.get("arcade.theme","arcade");
if (!THEMES[theme]) theme = "arcade";
let W = THEMES[theme].words;

let favs   = store.get("arcade.favs", []);
let recent = store.get("arcade.recent", []);
if (recent.length && typeof recent[0] === "string")
  recent = recent.map(k => ({ k, at: 0 }));
let plays  = store.get("arcade.plays", {});
let sort   = store.get("arcade.sort", "floor");

const SORTS  = ["floor","az","plays"];
const RANGES = [
  { label:"30 min",   ms: 30 * 60 * 1000 },
  { label:"1 hour",   ms: 60 * 60 * 1000 },
  { label:"24 hours", ms: 24 * 60 * 60 * 1000 },
  { label:"All time", ms: Infinity }
];
let range = Infinity;
let view  = { kind:"all", value:"__ALL__" };
let shown = [];
let spotAt = 0, spotTimer = null;
const SPOT_MS = 5000;

const floor = $("floor"), search = $("search"), count = $("count"),
      now = $("now"), side = $("side"), spot = $("spot"),
      subbar = $("subbar"), wipe = $("wipe");

function colourFor(name){
  const c = THEMES[theme].colours;
  if (c[name]) return c[name];
  if (name === "__ALL__")    return THEMES[theme].swatch;
  if (name === "__FAV__")    return THEMES[theme].swatch;
  if (name === "__RECENT__") return THEMES[theme].swatch;
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 72% 60%)`;
}

const tally = {};
GAMES.forEach(g => (g.c || []).forEach(c => tally[c] = (tally[c] || 0) + 1));
const cats = [...ORDER.filter(c => tally[c]),
              ...Object.keys(tally).filter(c => !ORDER.includes(c)).sort()];

/* ---------- theme picker ---------- */
function buildThemes(){
  const wrap = $("themes");
  wrap.textContent = "";
  Object.entries(THEMES).forEach(([id,t]) => {
    const b = document.createElement("button");
    b.className = "theme-btn";
    b.type = "button";
    b.innerHTML = '<i class="swatch"></i><span></span>';
    b.querySelector(".swatch").style.background = t.swatch;
    b.querySelector("span").textContent = t.label;
    b.setAttribute("aria-pressed", id === theme);
    b.addEventListener("click", () => setTheme(id));
    wrap.appendChild(b);
  });
}

function setTheme(id){
  theme = id;
  W = THEMES[id].words;
  store.set("arcade.theme", id);
  document.documentElement.dataset.theme = id;
  applyWords();
  buildThemes();
  buildSidebar();
  render();
}

function applyWords(){
  $("shopname").textContent = W.name;
  $("tagline").textContent =
    GAMES.length + " " + W.unit + (GAMES.length === 1 ? "" : "s") + " · " + W.tail;
  $("r1").innerHTML = W.r1;
  $("r2").innerHTML = W.r2;
  $("dice").textContent = W.dice;
  $("search").placeholder = W.search;
  $("spotEyebrow").textContent = W.eyebrow;
  $("foot").textContent = W.foot;
  document.title = W.name;
  const labels = { all:W.all, fav:W.fav, recent:W.recent };
  now.textContent = view.kind === "cat" ? view.value : labels[view.kind];
}

/* ---------- helpers ---------- */
function recentWindow(){
  const cut = range === Infinity ? -Infinity : Date.now() - range;
  return recent.filter(r => r.at >= cut);
}
function ago(at){
  if (!at) return "earlier";
  const s = Math.max(0,(Date.now()-at)/1000);
  if (s < 60)    return "just now";
  if (s < 3600)  return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function tagPill(name){
  const s = document.createElement("span");
  s.className = "tag";
  s.style.setProperty("--tone", colourFor(name));
  s.textContent = name;
  return s;
}
function matches(g){
  if (view.kind === "all")    return true;
  if (view.kind === "fav")    return favs.includes(key(g));
  if (view.kind === "recent") return recentWindow().some(r => r.k === key(g));
  return (g.c || []).includes(view.value);
}
function visible(){
  const q = search.value.trim().toLowerCase();
  if (view.kind === "recent"){
    const order = new Map(recentWindow().map((r,i) => [r.k,i]));
    return GAMES.filter(g => g.t.toLowerCase().includes(q) && order.has(key(g)))
                .sort((a,b) => order.get(key(a)) - order.get(key(b)));
  }
  const list = GAMES.filter(g => g.t.toLowerCase().includes(q) && matches(g));
  if (sort === "az")    list.sort((a,b) => a.t.localeCompare(b.t));
  else if (sort === "plays")
    list.sort((a,b) => (plays[key(b)]||0) - (plays[key(a)]||0) || a.t.localeCompare(b.t));
  return list;
}

/* ---------- sidebar ---------- */
function buildSidebar(){
  side.textContent = "";
  const add = (label, rows) => {
    const h = document.createElement("h2");
    h.textContent = label;
    side.appendChild(h);
    rows.forEach(r => side.appendChild(r));
  };
  const row = (kind, value, label, n, tone) => {
    const b = document.createElement("button");
    b.className = "pick";
    b.type = "button";
    b.innerHTML = '<i class="lamp"></i><span class="label"></span><span class="n"></span>';
    b.querySelector(".label").textContent = label;
    b.querySelector(".n").textContent = n;
    b.dataset.kind = kind; b.dataset.value = value;
    const colour = tone || colourFor(value);
    b.style.setProperty("--tone", colour);
    b.setAttribute("aria-pressed", view.kind === kind && view.value === value);
    b.addEventListener("click", () => {
      view = { kind, value };
      now.textContent = label;
      document.documentElement.style.setProperty("--pick", colour);
      render();
    });
    return b;
  };
  const sw = THEMES[theme].swatch;
  const link = document.createElement("button");
  link.className = "pick";
  link.type = "button";
  link.innerHTML = '<i class="lamp"></i><span class="label"></span><span class="n">&#8599;</span>';
  link.querySelector(".label").textContent = W.browser;
  link.style.setProperty("--tone", THEMES[theme].colours["Puzzle & Strategy"] || sw);
  link.addEventListener("click", () => { window.location.href = "Browser.htm"; });

  add(W.groups[0], [
    row("all",    "__ALL__",    W.all,    GAMES.length, sw),
    row("fav",    "__FAV__",    W.fav,    favs.length,  sw),
    row("recent", "__RECENT__", W.recent, recent.length, sw),
    link
  ]);
  add(W.groups[1], cats.map(c => row("cat", c, c, tally[c])));

  const h = document.createElement("h2");
  h.textContent = W.groups[2];
  side.appendChild(h);
  SORTS.forEach((id,i) => {
    const b = document.createElement("button");
    b.className = "pick sortpick";
    b.type = "button";
    b.innerHTML = '<i class="lamp"></i><span class="label"></span>';
    b.querySelector(".label").textContent = W.sorts[i];
    b.setAttribute("aria-pressed", sort === id);
    b.addEventListener("click", () => {
      sort = id; store.set("arcade.sort", sort);
      buildSidebar(); render();
    });
    side.appendChild(b);
  });
}

/* ---------- spotlight ---------- */
function paintSpot(){
  if (!shown.length) return;
  spotAt = (spotAt + shown.length) % shown.length;
  const g = shown[spotAt];
  spot.href = href(g);
  if (g.x){ spot.target = "_blank"; spot.rel = "noopener"; }
  else { spot.removeAttribute("target"); spot.removeAttribute("rel"); }
  $("spotImg").src = encodeURI(g.i);
  $("spotImg").alt = g.t;
  $("spotWash").style.backgroundImage = `url("${encodeURI(g.i)}")`;
  $("spotTitle").textContent = g.t;
  const tags = $("spotTags"); tags.textContent = "";
  (g.c || []).forEach(c => tags.appendChild(tagPill(c)));
  const dots = $("spotDots"); dots.textContent = "";
  shown.slice(0,12).forEach((_,i) => {
    const d = document.createElement("i");
    if (i === spotAt % Math.min(shown.length,12)) d.className = "live";
    dots.appendChild(d);
  });
}
function runSpot(){
  clearInterval(spotTimer);
  if (search.value.trim() || shown.length < 2){ spot.classList.remove("on"); return; }
  spot.classList.add("on");
  spotAt = Math.floor(Math.random() * shown.length);
  paintSpot();
  if (calm) return;
  spotTimer = setInterval(() => { spotAt++; paintSpot(); }, SPOT_MS);
}
spot.addEventListener("mouseenter", () => clearInterval(spotTimer));
spot.addEventListener("mouseleave", () => {
  if (!calm && spot.classList.contains("on"))
    spotTimer = setInterval(() => { spotAt++; paintSpot(); }, SPOT_MS);
});
spot.addEventListener("click", () => remember(shown[spotAt]));

/* ---------- history ---------- */
function remember(g){
  if (!g) return;
  const k = key(g);
  recent = [{ k, at: Date.now() }, ...recent.filter(r => r.k !== k)].slice(0,60);
  plays[k] = (plays[k] || 0) + 1;
  store.set("arcade.recent", recent);
  store.set("arcade.plays", plays);
}
function forget(k){
  recent = recent.filter(r => r.k !== k);
  store.set("arcade.recent", recent);
  buildSidebar(); render();
}

RANGES.forEach(r => {
  const b = document.createElement("button");
  b.className = "range"; b.type = "button"; b.textContent = r.label;
  b.setAttribute("aria-pressed", r.ms === range);
  b.addEventListener("click", () => {
    range = r.ms;
    $("ranges").querySelectorAll(".range").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("ranges").appendChild(b);
});

let armed = null;
wipe.addEventListener("click", () => {
  if (!armed){
    armed = setTimeout(() => { armed = null; wipe.classList.remove("armed"); wipe.textContent = "Clear history"; }, 3500);
    wipe.classList.add("armed"); wipe.textContent = "Click again to wipe";
    return;
  }
  clearTimeout(armed); armed = null;
  wipe.classList.remove("armed"); wipe.textContent = "Clear history";
  recent = []; plays = {};
  store.set("arcade.recent", recent); store.set("arcade.plays", plays);
  buildSidebar(); render();
});

/* ---------- render ---------- */
function render(){
  shown = visible();
  floor.textContent = "";
  count.textContent = shown.length;
  side.querySelectorAll(".pick:not(.sortpick)").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.kind === view.kind && b.dataset.value === view.value));

  subbar.classList.toggle("on", view.kind === "recent");
  runSpot();

  if (!shown.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = view.kind === "fav"
      ? "<strong>Nothing here yet</strong><span>Tap a star to keep something on this shelf.</span>"
      : view.kind === "recent"
        ? (recent.length
            ? "<strong>Nothing in that window</strong><span>Try a longer stretch of time.</span>"
            : "<strong>Nothing played yet</strong><span>Pick something and it will show up here.</span>")
        : "<strong>Nothing on this aisle</strong><span>Try another category, or a shorter search.</span>";
    floor.appendChild(e);
    return;
  }

  shown.forEach((g,n) => {
    const k = key(g);

    const slot = document.createElement("div");
    slot.className = "slot";
    slot.style.setProperty("--n", n);

    const a = document.createElement("a");
    a.className = "cab";
    a.href = href(g);
    if (g.x){ a.target = "_blank"; a.rel = "noopener"; }
    a.addEventListener("click", () => remember(g));

    const sign = document.createElement("div");
    sign.className = "cab__sign";
    sign.textContent = g.t;

    const screen = document.createElement("div");
    screen.className = "cab__screen";
    const img = document.createElement("img");
    img.src = encodeURI(g.i); img.alt = g.t; img.loading = "lazy";
    const flash = document.createElement("div");
    flash.className = "cab__flash";
    screen.append(img, flash);

    if ((g.c || []).length){
      const chip = tagPill(g.c[0]);
      chip.classList.add("cab__chip");
      screen.appendChild(chip);
    }

    const star = document.createElement("button");
    star.className = "star"; star.type = "button"; star.textContent = "★";
    star.setAttribute("aria-pressed", favs.includes(k));
    star.setAttribute("aria-label", "Favourite " + g.t);
    star.addEventListener("click", ev => {
      ev.preventDefault(); ev.stopPropagation();
      favs = favs.includes(k) ? favs.filter(f => f !== k) : [...favs, k];
      store.set("arcade.favs", favs);
      buildSidebar(); render();
    });

    const deck = document.createElement("div");
    deck.className = "cab__deck";
    deck.innerHTML = '<i class="stick"></i><i class="btn-a"></i><i class="btn-b"></i>';

    if (view.kind === "recent"){
      const entry = recent.find(r => r.k === k);
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = ago(entry && entry.at);
      const drop = document.createElement("button");
      drop.className = "drop"; drop.type = "button"; drop.textContent = "✕";
      drop.setAttribute("aria-label", "Remove " + g.t + " from history");
      drop.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); forget(k); });
      deck.append(when, drop);
    } else {
      const p = document.createElement("span");
      p.className = "plays";
      p.textContent = plays[k] ? W.plays + plays[k] : W.none;
      deck.appendChild(p);
    }
    if (g.x){
      const ext = document.createElement("span");
      ext.className = "ext"; ext.textContent = "↗";
      deck.appendChild(ext);
    }

    a.append(sign, star, screen, deck);

    const lip = document.createElement("div");
    lip.className = "shelf-lip";

    slot.append(a, lip);
    floor.appendChild(slot);
  });
}

/* ---------- surprise me ---------- */
$("dice").addEventListener("click", () => {
  if (!shown.length) return;
  const g = shown[Math.floor(Math.random() * shown.length)];
  remember(g);
  if (g.x) window.open(g.x, "_blank", "noopener");
  else window.location.href = href(g);
});

search.addEventListener("input", render);

/* ---------- keys ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== search){
    e.preventDefault(); search.focus(); search.select(); return;
  }
  if (e.key === "Escape" && document.activeElement === search){
    search.value = ""; render(); search.blur(); return;
  }
  if (!["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"].includes(e.key)) return;
  const cabs = [...floor.querySelectorAll(".cab")];
  if (!cabs.length) return;
  const at = cabs.indexOf(document.activeElement);
  if (at === -1){ e.preventDefault(); cabs[0].focus(); return; }
  const topOf = el => Math.round(el.getBoundingClientRect().top);
  const first = topOf(cabs[0]);
  const cols = cabs.filter(c => topOf(c) === first).length || 1;
  const step = { ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols }[e.key];
  const next = at + step;
  if (next >= 0 && next < cabs.length){ e.preventDefault(); cabs[next].focus(); }
});

/* ---------- idle takeover ---------- */
const IDLE_MS = 45000, TK_MS = 4000;
const tk = $("takeover");
let idleTimer = null, tkTimer = null, tkAt = 0, tkGuard = 0;

function tkPaint(){
  const pool = shown.length ? shown : GAMES;
  if (!pool.length) return;
  tkAt = (tkAt + pool.length) % pool.length;
  const g = pool[tkAt];
  const a = $("tkArt");
  a.href = href(g);
  if (g.x){ a.target = "_blank"; a.rel = "noopener"; }
  else { a.removeAttribute("target"); a.removeAttribute("rel"); }
  a.onclick = () => remember(g);
  $("tkImg").src = encodeURI(g.i);
  $("tkImg").alt = g.t;
  $("tkWash").style.backgroundImage = `url("${encodeURI(g.i)}")`;
  $("tkTitle").textContent = g.t;
  const tags = $("tkTags"); tags.textContent = "";
  (g.c || []).forEach(c => tags.appendChild(tagPill(c)));
}
function tkUp(){
  if (tk.classList.contains("up")) return;
  const pool = shown.length ? shown : GAMES;
  tkAt = Math.floor(Math.random() * pool.length);
  tkPaint();
  tk.classList.add("up");
  tk.setAttribute("aria-hidden","false");
  clearInterval(spotTimer);
  tkTimer = setInterval(() => { tkAt++; tkPaint(); }, TK_MS);
  tkGuard = Date.now() + 600;
}
function tkDown(){
  if (!tk.classList.contains("up")) return;
  tk.classList.remove("up");
  tk.setAttribute("aria-hidden","true");
  clearInterval(tkTimer);
  runSpot();
}
function poke(e){
  if (tk.classList.contains("up")){
    if (e && e.type === "mousemove" && Date.now() < tkGuard) return;
    tkDown();
  }
  clearTimeout(idleTimer);
  if (!calm) idleTimer = setTimeout(tkUp, IDLE_MS);
}
if (!calm){
  ["mousemove","mousedown","keydown","wheel","touchstart","focusin"]
    .forEach(ev => document.addEventListener(ev, poke, { passive:true }));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ clearTimeout(idleTimer); tkDown(); } else poke();
  });
  idleTimer = setTimeout(tkUp, IDLE_MS);
}

/* ---------- boot ---------- */
for (const id of ["bulbs-top","bulbs-bottom"]) {
  const row = $(id);
  for (let n = 0; n < 22; n++) {
    const b = document.createElement("i");
    b.className = "bulb";
    b.style.setProperty("--i", n);
    row.appendChild(b);
  }
}
document.documentElement.dataset.theme = theme;
document.documentElement.style.setProperty("--pick", THEMES[theme].swatch);
applyWords();
buildThemes();
buildSidebar();
render();
</script>
